data:
  train_batch_size: 64         
  micro_batch_size_per_gpu: 4  
  train_files: /path/to/your/train_data.parquet  
  val_files: /path/to/your/val_data.parquet      
  prompt_key: prompt            
  response_key: response        
  max_length: 8192            
  truncation: error             
  chat_template: null           
  balance_dp_token: False       
model:
  partial_pretrain: /path/to/your/model  
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  trust_remote_code: True       
  enable_gradient_checkpointing: True 
  lora_rank: 0                  
  lora_alpha: 16                
  target_modules: all-linear    
  use_liger: False              
optim:
  lr: 2e-5                      
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1       
  clip_grad: 1.0                
trainer:
  default_local_dir: ./output   
  total_epochs: 3               
  total_training_steps: null    
  project_name: verl_sft        
  experiment_name: sft_exp      
  logger: ['console']           
  seed: 42                      
  default_hdfs_dir: null        
ulysses_sequence_parallel_size: 1 
use_remove_padding: False         